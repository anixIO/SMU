<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}СМУ · Контроль усталости{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{% url 'asset' path='monitor.css' %}?v=3">
  {% block scripts %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#content">Перейти к содержимому</a>
  <header class="site-header">
    <div class="container topbar">
      <a class="brand" href="{% url 'dashboard' %}">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>СМУ <small>Контроль усталости</small></span>
      </a>
      <nav aria-label="Основная навигация">
        <a href="{% url 'dashboard' %}" {% block monitor_current %}{% endblock %}>Наблюдение</a>
        {% if show_admin or staff_page %}
          <a href="{% url 'staff' %}" {% block staff_current %}{% endblock %}>Администрирование</a>
        {% endif %}
      </nav>
      {% if staff_page %}
        <form class="sign-out" method="post" action="{% url 'staff-logout' %}">
          {% csrf_token %}<button type="submit" class="button button-quiet">Выйти</button>
        </form>
      {% endif %}
    </div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
