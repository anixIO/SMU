# пороги детекции глаз
EYE_AR_THRESH: 0.22          # ниже этого значения глаз считается закрытым
EYE_AR_CONSEC_FRAMES: 12     # сколько кадров подряд закрытых глаз = усталость

# пороги детекции рта
MAR_THRESH: 0.3              # выше этого значения рот считается открытым (зевки)
YAWN_CONSEC_FRAMES: 15       # сколько кадров подряд зевка = усталость

# perclos - доля закрытых глаз в окне
PERCLOS_WINDOW: 150          # размер скользящего окна в кадрах
PERCLOS_THRESH: 0.4          # доля выше которой считается усталостью

# эмоции
FER_THRESH: 1                # 1 = эмоции фактически отключены (доля грусти не может быть больше 1)
EMOTION_SKIP_FRAMES: 3       # считаем эмоции каждый n-й кадр (для скорости)

# поза головы в градусах
HEAD_PITCH_THRESH: 35        # наклон вперёд/назад
HEAD_YAW_THRESH: 30          # поворот влево/вправо

# прочее
ALERT_COOLDOWN: 4           # пауза между оповещениями в секундах
MODEL_PATH: 'emotion_model.h5'   # путь к модели эмоций (опционально)
CAMERA_INDEX: 0              # номер камеры (0 - встроенная)